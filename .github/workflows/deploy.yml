name: Deploy to Alibaba Cloud

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 在 GitHub 机器上构建前端（比阿里云小实例快很多），再同步 .next 到服务器
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Frontend on CI
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          API_PROXY_ORIGIN: http://127.0.0.1:4100
          POST_API_PROXY_ORIGIN: http://127.0.0.1:5001
        run: |
          npm ci
          npm run build --workspace frontend
          test -f frontend/.next/BUILD_ID

      - name: Sync Files to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT }}
          TARGET: "/opt/anime-app"
          ARGS: "-rlgoDzvO"
          EXCLUDE: "/node_modules/, /frontend/node_modules/, /backend/node_modules/, /backend/user_post_backend/venv/, /backend/user_post_backend/__pycache__/, .git/, .github/, .env, .env.local, .env.example"

      - name: SSH Command Run (Install & Restart)
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_SHA,SERVER_IP
          script: |
            set -euo pipefail

            APP_DIR="/opt/anime-app"
            DEPLOY_TAG="${DEPLOY_SHA:0:7}"
            PUBLIC_ORIGIN="http://${SERVER_IP}"
            PUBLIC_ORIGIN_WITH_PORT="http://${SERVER_IP}:3001"
            WEB_ORIGINS="$PUBLIC_ORIGIN,$PUBLIC_ORIGIN_WITH_PORT,http://127.0.0.1:3001,http://localhost:3001"
            echo "$DEPLOY_SHA" > "$APP_DIR/DEPLOYED_SHA"
            echo "Deploying commit $DEPLOY_TAG (frontend pre-built on CI)"

            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2 globally..."
              npm install -g pm2
            fi

            # 清理旧版进程名，避免与 acg-* 抢端口
            pm2 delete frontend backend flask acg-frontend acg-node-backend acg-py-backend 2>/dev/null || true

            echo "====== Deploying Node Backend ======"
            cd "$APP_DIR/backend"
            npm install --production
            pm2 delete acg-node-backend 2>/dev/null || true
            PORT=4100 CORS_ORIGIN="$WEB_ORIGINS" \
              pm2 start app.js --name acg-node-backend --cwd "$APP_DIR/backend" --update-env

            echo "====== Deploying Python Backend ======"
            cd "$APP_DIR/backend/user_post_backend"
            export FLASK_PORT=5001
            export CORS_ORIGIN="$WEB_ORIGINS"
            if [ -d "venv" ]; then
              source venv/bin/activate
              pm2 delete acg-py-backend 2>/dev/null || true
              pm2 start app.py --name acg-py-backend --cwd "$APP_DIR/backend/user_post_backend" --interpreter ./venv/bin/python --update-env
            else
              pip install -r requirements.txt
              pm2 delete acg-py-backend 2>/dev/null || true
              pm2 start app.py --name acg-py-backend --cwd "$APP_DIR/backend/user_post_backend" --interpreter python3 --update-env
            fi

            echo "====== Starting Next.js Frontend (skip server build) ======"
            cd "$APP_DIR/frontend"
            npm install --omit=dev
            test -f .next/BUILD_ID || (echo "Missing .next from CI sync" && exit 1)

            pm2 delete acg-frontend 2>/dev/null || true
            API_PROXY_ORIGIN="http://127.0.0.1:4100" POST_API_PROXY_ORIGIN="http://127.0.0.1:5001" \
              pm2 start npm --name acg-frontend --cwd "$APP_DIR/frontend" --update-env -- run start -- -p 3001 -H 0.0.0.0

            pm2 save
            pm2 ls
            echo "====== Deploy finished: $DEPLOY_TAG ======"

      - name: Verify Deploy
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_SHA,SERVER_IP
          script: |
            set -euo pipefail
            APP_DIR="/opt/anime-app"
            DEPLOY_TAG="${DEPLOY_SHA:0:7}"
            ON_SERVER="$(cat "$APP_DIR/DEPLOYED_SHA" | head -c 7)"
            if [ "$ON_SERVER" != "$DEPLOY_TAG" ]; then
              echo "DEPLOYED_SHA mismatch: expected $DEPLOY_TAG got $ON_SERVER"
              exit 1
            fi
            test -f "$APP_DIR/frontend/.next/BUILD_ID"
            curl -fsS "http://127.0.0.1:4100/health" > /dev/null
            curl -fsS "http://127.0.0.1:5001/health" > /dev/null
            curl -fsS "http://127.0.0.1:3001/api/stats/visit" > /dev/null
            curl -fsS "http://127.0.0.1:3001/post-api/health" > /dev/null
            curl -fsS "http://127.0.0.1:3001/post-api/character/list" > /dev/null
            curl -fsS "http://127.0.0.1:3001/community" > /dev/null
            echo "Verification passed for $DEPLOY_TAG"
