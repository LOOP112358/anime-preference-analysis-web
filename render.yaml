services:
  - type: web
    name: acg-personality-analyzer-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat-v3-0324:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        value: ACG Personality Analyzer
      - key: CORS_ORIGIN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
