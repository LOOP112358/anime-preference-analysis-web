<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的番剧分享</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>我的番剧分享</h1>
      <p>记录你喜欢的每一部番剧</p>
    </header>

    <!-- 发布表单 -->
    <div class="post-form">
      <input type="text" id="title" placeholder="番剧名称（如：进击的巨人）" required>
      <textarea id="content" placeholder="写下你的评价/推荐理由" required></textarea>
      <button id="postBtn">发布番剧</button>
    </div>

    <h2 class="section-title">已分享番剧</h2>
    <div id="postList" class="post-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
